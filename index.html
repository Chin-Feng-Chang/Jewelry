                      </div>

                      {/* 本場主推商品 */}
                      <div className="lg:col-span-4 bg-stone-900 border border-stone-800 p-6 rounded flex flex-col justify-between">
                        <div>
                          <div className="text-xs font-serif text-[#C2A675] mb-2">★ 本場直播主推大作</div>
                          <img src={MOCK_PRODUCTS[0].images[0]} className="w-full h-44 object-cover rounded mb-3" />
                          <h4 className="font-serif text-lg font-bold text-white">{MOCK_PRODUCTS[0].name}</h4>
                          <p className="text-xs text-stone-400 mt-1 line-clamp-2">{MOCK_PRODUCTS[0].description}</p>
                        </div>
                        <div className="mt-4 pt-4 border-t border-stone-800 flex items-center justify-between">
                          <div>
                            <span className="text-xs text-stone-400 block font-serif">直播典藏價</span>
                            <span className="text-xl font-serif font-bold text-[#C2A675]">NT$ {MOCK_PRODUCTS[0].price.toLocaleString()}</span>
                          </div>
                          <button
                            onClick={() => addToCart(MOCK_PRODUCTS[0])}
                            className="px-4 py-2 bg-[#8C2D19] text-white font-serif text-xs rounded shadow"
                          >
                            搶先認購孤品
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </section>

                {/* Categories */}
                <section className="py-20 bg-[#F7F6F2]">
                  <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                    <span className="oriental-seal font-serif mb-2">三大雅集主題</span>
                    <h2 className="text-3xl font-serif font-bold text-[#262524] mb-12">精選東方藝術品分類</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8 text-left">
                      {[
                        { id: 'zisha', title: '宜興紫砂', subtitle: '黃龍山老泥・名家全手工拍打壺', img: MOCK_PRODUCTS[0].images[0] },
                        { id: 'jade', title: '緬甸翡翠', subtitle: '老坑玻璃種・正陽綠大師雕琢佩飾', img: MOCK_PRODUCTS[1].images[0] },
                        { id: 'amber', title: '天然琥珀', subtitle: '億年金藍珀・波羅的海自然血珀', img: MOCK_PRODUCTS[2].images[0] }
                      ].map(cat => (
                        <div
                          key={cat.id}
                          onClick={() => { setCategory(cat.id); setView('catalog'); }}
                          className="group relative h-96 rounded overflow-hidden cursor-pointer shadow border border-stone-200"
                        >
                          <div className="absolute inset-0 bg-cover bg-center group-hover:scale-105 transition-transform duration-700" style={{ backgroundImage: `url(${cat.img})` }}></div>
                          <div className="absolute inset-0 bg-gradient-to-t from-[#1A1918]/90 via-transparent to-transparent"></div>
                          <div className="absolute bottom-6 left-6 text-white">
                            <h3 className="font-serif text-2xl font-bold">{cat.title}</h3>
                            <p className="text-xs text-stone-300 mt-1">{cat.subtitle}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </section>
              </>
            )}

            {view === 'catalog' && (
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                <div className="border-b border-stone-200 pb-6 mb-8 flex justify-between items-end">
                  <div>
                    <span className="oriental-seal font-serif mb-1">雅集大觀</span>
                    <h1 className="text-3xl font-serif font-bold text-[#262524]">全部典藏藝品鑑賞</h1>
                  </div>
                  <div className="flex gap-2">
                    {['all', 'zisha', 'jade', 'amber'].map(c => (
                      <button
                        key={c}
                        onClick={() => setCategory(c)}
                        className={`px-3 py-1 text-xs font-serif rounded ${category === c ? 'bg-[#8C2D19] text-white' : 'bg-white border text-stone-700'}`}
                      >
                        {c === 'all' ? '全部' : c === 'zisha' ? '紫砂' : c === 'jade' ? '翡翠' : '琥珀'}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                  {MOCK_PRODUCTS.filter(p => category === 'all' || p.category === category).map(p => (
                    <div key={p.id} className="bg-white rounded border border-stone-200 overflow-hidden shadow-sm flex flex-col justify-between">
                      <div className="cursor-pointer" onClick={() => { setSelectedProduct(p); setView('detail'); }}>
                        <div className="aspect-square relative overflow-hidden bg-stone-100">
                          <img src={p.images[0]} className="w-full h-full object-cover hover:scale-105 transition-transform" />
                          <span className="absolute top-2 left-2 gold-badge">孤品編號 #{p.code}</span>
                        </div>
                        <div className="p-4">
                          <span className="text-[10px] text-[#73716B] font-serif">【{p.specs.origin}】</span>
                          <h3 className="font-serif text-lg font-bold text-[#262524]">{p.name}</h3>
                          <p className="text-xs text-[#73716B] mt-1 line-clamp-2">{p.description}</p>
                        </div>
                      </div>
                      <div className="p-4 border-t flex justify-between items-center bg-stone-50">
                        <span className="font-serif font-bold text-[#8C2D19] text-lg">NT$ {p.price.toLocaleString()}</span>
                        <button
                          onClick={() => addToCart(p)}
                          className="px-3 py-1.5 bg-[#1A1918] hover:bg-[#8C2D19] text-white font-serif text-xs rounded"
                        >
                          認購孤品
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {view === 'detail' && selectedProduct && (
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                <button onClick={() => setView('catalog')} className="text-xs font-serif text-[#73716B] hover:text-[#8C2D19] mb-6">
                  ← 返回典藏藝品清單
                </button>
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 bg-white p-8 rounded-lg border border-stone-200">
                  {/* Left: Magnifier Image */}
                  <div className="lg:col-span-7">
                    <div 
                      onMouseMove={handleMouseMove}
                      onMouseLeave={() => setMagnifier({ show: false })}
                      className="relative aspect-square rounded overflow-hidden bg-stone-100 border cursor-crosshair"
                    >
                      <img src={selectedProduct.images[0]} className="w-full h-full object-cover" />
                      {magnifier.show && (
                        <div
                          className="absolute w-44 h-44 rounded-full border-2 border-[#C2A675] shadow-2xl pointer-events-none overflow-hidden"
                          style={{
                            top: `${magnifier.y - 88}px`,
                            left: `${magnifier.x - 88}px`,
                            backgroundImage: `url(${selectedProduct.images[0]})`,
                            backgroundPosition: `${magnifier.bgX}% ${magnifier.bgY}%`,
                            backgroundSize: '350%'
                          }}
                        />
                      )}
                    </div>
                    <div className="text-[11px] text-stone-500 font-serif mt-2 text-center">
                      ★ 滑鼠懸停於圖片上可啟動微距放大鏡鑑賞泥料質感或水頭質地
                    </div>
                  </div>

                  {/* Right: Info */}
                  <div className="lg:col-span-5 space-y-6">
                    <span className="gold-badge">獨家一物一拍孤品 #{selectedProduct.code}</span>
                    <h1 className="font-serif text-3xl font-bold text-[#262524]">{selectedProduct.name}</h1>
                    <div className="bg-[#F7F6F2] p-4 rounded border">
                      <span className="text-xs text-[#73716B] font-serif">藏家典藏專屬價</span>
                      <div className="text-3xl font-serif font-bold text-[#8C2D19] mt-1">
                        NT$ {selectedProduct.price.toLocaleString()}
                      </div>
                    </div>

                    <div className="space-y-2 text-xs font-sans border-y py-4">
                      <div><strong>泥料產地：</strong>{selectedProduct.specs.origin}</div>
                      <div><strong>規格容量：</strong>{selectedProduct.specs.dimensions}</div>
                      <div><strong>淨重數據：</strong>{selectedProduct.specs.weight}</div>
                      {selectedProduct.specs.artist && <div><strong>大師作工：</strong><span className="text-[#8C2D19] font-bold">{selectedProduct.specs.artist}</span></div>}
                      {selectedProduct.specs.certificateNo && <div><strong>鑑定字號：</strong>{selectedProduct.specs.certificateNo}</div>}
                    </div>

                    <div className="space-y-3">
                      <button
                        onClick={() => addToCart(selectedProduct)}
                        className="w-full py-3.5 bg-[#8C2D19] text-white font-serif text-sm rounded font-bold shadow"
                      >
                        加入購物車並保留孤品
                      </button>
                      <a
                        href="https://line.me"
                        target="_blank"
                        className="w-full py-3 bg-[#06C755] text-white font-serif text-xs rounded flex items-center justify-center gap-2"
                      >
                        LINE 專人一對一諮詢品相
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Cart Drawer */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden">
              <div onClick={() => setIsCartOpen(false)} className="absolute inset-0 bg-black/60 backdrop-blur-sm" />
              <div className="fixed inset-y-0 right-0 max-w-full flex pl-10">
                <div className="w-screen max-w-md bg-white shadow-2xl flex flex-col justify-between">
                  <div className="p-6 bg-[#1A1918] text-white flex justify-between items-center">
                    <h2 className="font-serif text-lg font-bold">雅集典藏購物車 ({cart.length})</h2>
                    <button onClick={() => setIsCartOpen(false)} className="text-stone-400 hover:text-white">✕</button>
                  </div>
                  <div className="flex-1 overflow-y-auto p-6 space-y-4">
                    {cart.map((item, idx) => (
                      <div key={idx} className="flex gap-4 p-3 bg-[#F7F6F2] rounded border">
                        <img src={item.product.images[0]} className="w-16 h-16 object-cover rounded" />
                        <div className="flex-1">
                          <h4 className="font-serif text-sm font-bold">{item.product.name}</h4>
                          <span className="text-xs text-[#8C2D19] font-bold block mt-1">NT$ {item.product.price.toLocaleString()}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                  <div className="p-6 bg-stone-50 border-t space-y-4">
                    <div className="flex justify-between font-serif font-bold text-lg text-[#8C2D19]">
                      <span>總計 Total</span>
                      <span>NT$ {subtotal.toLocaleString()}</span>
                    </div>
                    <button
                      onClick={() => alert('感謝認購！即將轉接專人安排全額保價恆溫專車送達。')}
                      className="w-full py-3.5 bg-[#8C2D19] text-white font-serif text-sm rounded shadow font-bold"
                    >
                      前往結帳認購
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-[#1A1918] text-white py-12 border-t border-[#C2A675]/20 font-serif text-center text-xs text-stone-400">
            <p>© 2026 雅集典藏 Oriental Luxury Gallery. 一物一拍・名家孤品權威鑑定。</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
